name: Compilar APK de Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK y NDK
        uses: android-actions/setup-android@v2

      - name: Instalar NDK y CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Otorgar permisos a Gradle
        run: chmod +x gradlew || true

      - name: Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: NFSHS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
